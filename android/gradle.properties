org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# Kotlin incremental compiler crashes ("this and base files have different
# roots") when the project (here D:) and the pub cache (C:) sit on different
# Windows drives — a known cross-drive relativeTo() bug in the Kotlin
# build-tools API, unrelated to app code. Disabling incremental compilation
# avoids it; full (non-incremental) compiles just take a bit longer.
kotlin.incremental=false
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
